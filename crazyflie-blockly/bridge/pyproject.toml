[project]
name = "drone-lab-bridge"
version = "0.1.0"
description = "WebSocket bridge between the Drone Lab UI and a Crazyflie (real, or simulated via CrazySim)."
requires-python = ">=3.11"
dependencies = [
    # cflib from git: the PyPI release lags behind CrazySim's UDP backend.
    "cflib @ git+https://github.com/bitcraze/crazyflie-lib-python.git",
    "websockets>=12.0",
    "mujoco>=3.1",
    "numpy>=1.26",
]

[tool.uv]
package = false
